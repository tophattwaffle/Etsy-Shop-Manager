# Builds, tests and deploys every push to master (i.e. every merged PR) to the Windows host.
# Runs on the self-hosted gitea-runner registered on that host with the label "esm-deploy" (host mode).
# Setup: docs/DEPLOY.md
name: Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: esm-deploy
    defaults:
      run:
        shell: pwsh
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - name: Check out
        uses: actions/checkout@v4

      # The runner is a Windows service, which keeps the PATH from when Windows booted, so tools installed later
      # (PowerShell 7, .NET SDK) may be missing. cmd.exe is always available; add the known install folders to
      # GITHUB_PATH so every later step finds them, and print what was found for troubleshooting.
      - name: Locate tools
        shell: cmd
        run: |
          @echo off
          for %%D in ("%ProgramFiles%\PowerShell\7" "%ProgramFiles%\dotnet" "%ProgramFiles%\Git\cmd" "%ProgramFiles%\nodejs") do (
            if exist "%%~D" (
              echo %%~D>>"%GITHUB_PATH%"
              echo found   %%~D
            ) else (
              echo MISSING %%~D
            )
          )
          if not exist "%ProgramFiles%\PowerShell\7\pwsh.exe" (
            echo ERROR: PowerShell 7 not found at "%ProgramFiles%\PowerShell\7\pwsh.exe". Run scripts\install-prereqs.ps1 on the host.
            exit /b 1
          )
          if not exist "%ProgramFiles%\dotnet\dotnet.exe" (
            echo ERROR: .NET SDK not found at "%ProgramFiles%\dotnet\dotnet.exe". Run scripts\install-prereqs.ps1 on the host.
            exit /b 1
          )

      - name: Build and test
        run: ./scripts/build.ps1 -Configuration Release

      - name: Publish
        run: |
          if (Test-Path artifacts/publish) { Remove-Item artifacts/publish -Recurse -Force }
          dotnet publish src/EtsyShopManager.Web -c Release -r win-x64 --self-contained true -o artifacts/publish
          if ($LASTEXITCODE) { throw 'dotnet publish failed' }

      - name: Deploy
        run: ./scripts/deploy.ps1 -PublishDir artifacts/publish -Version '${{ gitea.sha }}'
